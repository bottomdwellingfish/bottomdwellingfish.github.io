<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#00ff41"/>
<meta name="color-scheme" content="dark"/>
<title>STUPID TODO — Retro Terminal Task Manager</title>
<style>
:root {
  --phosphor-green: #00ff41;
  --phosphor-dim: #00cc33;
  --amber-warning: #ffb000;
  --red-alert: #ff2d00;
  --paper-white: #f5f5dc;
  --metal-silver: #c0c0c0;
  --terminal-black: #0a0a0a;
  --terminal-dark: #1a1a1a;
  --font-mono: 'SF Mono', 'Monaco', 'Menlo', 'DejaVu Sans Mono', 'Courier New', monospace;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 20px;
}
@media (min-width: 768px) {
  :root {
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 32px;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-mono);
  background: var(--terminal-black);
  color: var(--phosphor-green);
  font-size: 14px;
  line-height: 1.4;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-md);
}
.crt-monitor {
  position: relative;
  width: 100%;
  max-width: 640px;
  background: var(--terminal-black);
  border: 3px solid var(--metal-silver);
  border-radius: 8px;
  padding: var(--space-md);
  box-shadow: 0 0 8px rgba(0,255,65,0.15), inset 0 0 20px rgba(0,0,0,0.5);
  min-height: 200px;
}
@media (min-width: 768px) {
  .crt-monitor {
    padding: var(--space-xl);
    border-radius: 12px;
    min-height: 300px;
  }
}
.crt-monitor::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.03) 2px, rgba(0,255,65,0.03) 4px);
  pointer-events: none;
  border-radius: 8px;
}
@media (min-width: 768px) {
  .crt-monitor::before { border-radius: 12px; }
}
@media (min-width: 1024px) {
  .crt-monitor::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 70%, rgba(0,0,0,0.2) 100%);
    pointer-events: none;
    border-radius: 12px;
  }
}
.terminal-text {
  font-family: var(--font-mono);
  color: var(--phosphor-green);
  text-shadow: 0 0 2px currentColor;
  letter-spacing: 0.5px;
}
.terminal-text--dim { color: var(--phosphor-dim); text-shadow: none; }
.terminal-text--amber { color: var(--amber-warning); text-shadow: 0 0 2px var(--amber-warning); }
.terminal-text--red { color: var(--red-alert); text-shadow: 0 0 2px var(--red-alert); }
.blinking-cursor::after {
  content: '█';
  color: var(--phosphor-green);
  animation: blink 1s infinite;
  margin-left: 2px;
}
@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}
.vintage-btn {
  font-family: var(--font-mono);
  background: linear-gradient(135deg, #333, #222);
  color: var(--phosphor-green);
  border: 2px solid var(--metal-silver);
  border-radius: 4px;
  padding: var(--space-sm) var(--space-md);
  cursor: pointer;
  transition: all 0.2s ease;
  text-transform: uppercase;
  font-weight: bold;
  letter-spacing: 1px;
  min-height: 44px;
  font-size: 12px;
}
.vintage-btn:hover {
  background: linear-gradient(135deg, #444, #333);
  box-shadow: 0 0 2px rgba(0,255,65,0.2);
  text-shadow: 0 0 1px currentColor;
}
.vintage-btn:active { transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
.vintage-btn--danger { color: var(--red-alert); }
.vintage-btn--warning { color: var(--amber-warning); }
.vintage-btn--active {
  background: var(--phosphor-green);
  color: var(--terminal-black);
  box-shadow: 0 0 5px rgba(0,255,65,0.4);
}
.control-panel {
  background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
  border: 2px solid var(--metal-silver);
  border-radius: 6px;
  padding: var(--space-md);
  box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 2px 5px rgba(0,0,0,0.3);
  display: flex;
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
}
@media (min-width: 768px) {
  .control-panel { gap: var(--space-md); }
}
.todo-input {
  flex: 1;
  background: var(--terminal-black);
  border: 2px solid var(--metal-silver);
  border-radius: 4px;
  color: var(--phosphor-green);
  font-family: var(--font-mono);
  font-size: 14px;
  padding: var(--space-sm) var(--space-md);
  min-height: 44px;
}
.todo-input:focus {
  outline: none;
  border-color: var(--phosphor-green);
  box-shadow: 0 0 8px rgba(0,255,65,0.5);
}
.todo-input::placeholder { color: var(--phosphor-dim); opacity: 0.7; }
.status-led {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: var(--space-sm);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 0 3px rgba(0,0,0,0.3);
}
.status-led--green { background: var(--phosphor-green); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 0 4px rgba(0,255,65,0.4); }
.status-led--amber { background: var(--amber-warning); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 0 4px rgba(255,176,0,0.4); }
.status-led--red { background: var(--red-alert); box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 0 4px rgba(255,45,0,0.4); }
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
  flex-wrap: wrap;
  gap: var(--space-sm);
}
.title-section { display: flex; align-items: center; gap: var(--space-sm); }
.todo-stats { font-size: 12px; display: flex; align-items: center; gap: var(--space-sm); }
.retro-progress-track {
  height: 20px;
  background: #000;
  border: 2px inset var(--metal-silver);
  box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #fff, inset -2px -2px 0 #404040, inset 2px 2px 0 #dfdfdf;
  overflow: hidden;
  image-rendering: pixelated;
  margin-bottom: var(--space-md);
}
.retro-progress-fill {
  height: 100%;
  transition: width 0.5s ease;
  background: var(--phosphor-green);
  border-top: 2px solid rgba(255,255,255,0.8);
  border-left: 2px solid rgba(255,255,255,0.6);
  border-bottom: 2px solid rgba(0,0,0,0.6);
  border-right: 2px solid rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
  image-rendering: pixelated;
}
.retro-progress-fill.ultra-pixelated {
  background-image:
    repeating-linear-gradient(90deg, currentColor 0px, currentColor 4px, rgba(255,255,255,0.4) 4px, rgba(255,255,255,0.4) 6px, currentColor 6px, currentColor 10px, rgba(0,0,0,0.3) 10px, rgba(0,0,0,0.3) 12px),
    repeating-linear-gradient(0deg, currentColor 0px, currentColor 4px, rgba(0,0,0,0.2) 4px, rgba(0,0,0,0.2) 6px, currentColor 6px, currentColor 10px, rgba(255,255,255,0.2) 10px, rgba(255,255,255,0.2) 12px);
  border-top: 3px solid rgba(255,255,255,0.9);
  border-left: 3px solid rgba(255,255,255,0.7);
  border-bottom: 3px solid rgba(0,0,0,0.7);
  border-right: 3px solid rgba(0,0,0,0.5);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3), inset 0 0 6px rgba(0,0,0,0.4), 0 0 4px currentColor;
}
.progress-labels {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: var(--space-xs);
}
.label-lazy { color: var(--red-alert); text-shadow: 0 0 4px var(--red-alert); animation: pulse-red 2s infinite; }
.label-productive { color: var(--phosphor-green); text-shadow: 0 0 4px var(--phosphor-green); animation: glow-green 3s infinite; }
@keyframes pulse-red { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
@keyframes glow-green { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
.todo-list { list-style: none; margin-top: var(--space-md); }
.todo-item {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-sm) var(--space-md);
  border: 1px solid var(--metal-silver);
  border-top: none;
  background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
  min-height: 44px;
  transition: background 0.2s;
}
.todo-item:first-child { border-top: 1px solid var(--metal-silver); }
.todo-item:last-child { border-bottom: 2px solid var(--metal-silver); }
.todo-item:hover { background: linear-gradient(135deg, #2a2a2a, #1a1a1a); }
.todo-check {
  width: 20px; height: 20px;
  border: 2px solid var(--metal-silver);
  border-radius: 3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: #000;
  transition: all 0.2s;
  font-size: 14px;
  color: var(--phosphor-green);
}
.todo-check:hover { border-color: var(--phosphor-green); box-shadow: 0 0 4px rgba(0,255,65,0.3); }
.todo-check.checked {
  background: var(--phosphor-green);
  border-color: var(--phosphor-green);
  color: #000;
  box-shadow: 0 0 6px rgba(0,255,65,0.5);
}
.todo-text {
  flex: 1;
  font-size: 14px;
  word-break: break-word;
  transition: all 0.3s;
}
.todo-text.done {
  text-decoration: line-through;
  opacity: 0.5;
  color: var(--phosphor-dim);
}
.todo-delete {
  background: none;
  border: none;
  color: var(--red-alert);
  cursor: pointer;
  font-size: 18px;
  padding: 4px 8px;
  opacity: 0.5;
  transition: all 0.2s;
  font-family: var(--font-mono);
}
.todo-delete:hover { opacity: 1; text-shadow: 0 0 4px var(--red-alert); }
.filter-bar {
  display: flex;
  gap: var(--space-xs);
  margin-top: var(--space-md);
  justify-content: center;
  flex-wrap: wrap;
}
.filter-bar .vintage-btn { padding: var(--space-xs) var(--space-sm); min-height: 36px; font-size: 11px; }
.empty-state {
  text-align: center;
  padding: var(--space-xl);
  color: var(--phosphor-dim);
  font-size: 13px;
}
.ticker-tape {
  overflow: hidden;
  background: rgba(0,255,65,0.05);
  border-top: 1px solid var(--metal-silver);
  border-bottom: 1px solid var(--metal-silver);
  padding: 6px 0;
  margin-bottom: var(--space-md);
  white-space: nowrap;
  font-size: 11px;
}
.ticker-content {
  display: inline-block;
  animation: ticker-scroll 20s linear infinite;
}
.ticker-content span { margin-right: 40px; }
.ticker-content .green { color: var(--phosphor-green); }
.ticker-content .amber { color: var(--amber-warning); }
.ticker-content .red { color: var(--red-alert); }
@keyframes ticker-scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.footer-info {
  margin-top: var(--space-md);
  text-align: center;
  font-size: 10px;
  color: var(--phosphor-dim);
  opacity: 0.6;
}
@media (max-width: 767px) {
  .header-row { flex-direction: column; align-items: stretch; }
  .title-section { justify-content: center; }
  .todo-stats { justify-content: center; }
  .control-panel { flex-direction: column; }
}
@keyframes fadeInUp {
  0% { opacity: 0; transform: translateY(20px); }
  100% { opacity: 1; transform: translateY(0); }
}
.todo-item { animation: fadeInUp 0.3s ease-out; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div class="crt-monitor">
  <div class="ticker-tape">
    <div class="ticker-content">
      <span class="green">[SYS] TODO TERMINAL v4.0.0</span>
      <span class="amber">[WARN] 拖延检测系统已激活</span>
      <span class="red">[CRIT] 未完成任务: <span id="ticker-count">0</span></span>
      <span class="green">[OK] 生产力模块运行中</span>
      <span class="amber">[INFO] 优先级引擎就绪</span>
      <span class="green">[SYS] TODO TERMINAL v4.0.0</span>
      <span class="amber">[WARN] 拖延检测系统已激活</span>
      <span class="red">[CRIT] 未完成任务: <span id="ticker-count2">0</span></span>
      <span class="green">[OK] 生产力模块运行中</span>
      <span class="amber">[INFO] 优先级引擎就绪</span>
    </div>
  </div>

  <div class="header-row">
    <div class="title-section">
      <span class="terminal-text" style="font-size:20px;font-weight:bold;">STUPID TODO</span>
      <span class="blinking-cursor" style="font-size:20px;"></span>
    </div>
    <div class="todo-stats">
      <span class="status-led status-led--green" id="stats-led"></span>
      <span class="terminal-text--dim" id="stats-text">0/0 完成</span>
    </div>
  </div>

  <div class="progress-labels">
    <span class="label-lazy">懒惰</span>
    <span class="label-productive">高效</span>
  </div>
  <div class="retro-progress-track">
    <div class="retro-progress-fill ultra-pixelated" id="progress-fill" style="width:0%;background:var(--red-alert)"></div>
  </div>

  <div class="control-panel">
    <input class="todo-input" id="todo-input" type="text" placeholder="输入新任务..." autofocus>
    <button class="vintage-btn" id="add-btn">添加</button>
  </div>

  <div class="filter-bar">
    <button class="vintage-btn vintage-btn--active" data-filter="all">全部</button>
    <button class="vintage-btn" data-filter="active">进行中</button>
    <button class="vintage-btn" data-filter="completed">已完成</button>
    <button class="vintage-btn vintage-btn--danger" id="clear-btn">清除完成</button>
  </div>

  <ul class="todo-list" id="todo-list">
    <li class="empty-state"><span class="terminal-text--dim">终端空闲 — 无待办任务</span></li>
  </ul>

  <div class="footer-info">
    <span>STUPID TODO v1.0.0 | 按 Enter 快速添加 |</span>
    <span id="footer-time">INITIALIZING...</span>
  </div>
</div>

<script>
(function() {
  let todos = JSON.parse(localStorage.getItem('stupidTodos')) || [];
  let currentFilter = 'all';

  const els = {
    input: document.getElementById('todo-input'),
    addBtn: document.getElementById('add-btn'),
    list: document.getElementById('todo-list'),
    progress: document.getElementById('progress-fill'),
    statsText: document.getElementById('stats-text'),
    statsLed: document.getElementById('stats-led'),
    tickerCount: document.getElementById('ticker-count'),
    tickerCount2: document.getElementById('ticker-count2'),
    clearBtn: document.getElementById('clear-btn'),
    footerTime: document.getElementById('footer-time'),
    filterBtns: document.querySelectorAll('[data-filter]')
  };

  function save() {
    localStorage.setItem('stupidTodos', JSON.stringify(todos));
  }

  function getFiltered() {
    if (currentFilter === 'active') return todos.filter(t => !t.done);
    if (currentFilter === 'completed') return todos.filter(t => t.done);
    return todos;
  }

  function getActiveCount() {
    return todos.filter(t => !t.done).length;
  }

  function getDoneCount() {
    return todos.filter(t => t.done).length;
  }

  function render() {
    const filtered = getFiltered();
    const total = todos.length;
    const active = getActiveCount();
    const done = getDoneCount();
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);

    els.progress.style.width = pct + '%';
    els.progress.style.background = pct < 33 ? 'var(--red-alert)' : pct < 66 ? 'var(--amber-warning)' : 'var(--phosphor-green)';
    els.statsText.textContent = done + '/' + total + ' 完成';

    if (active === 0 && total > 0) {
      els.statsLed.className = 'status-led status-led--green';
    } else if (active > 0) {
      els.statsLed.className = 'status-led status-led--amber';
    } else {
      els.statsLed.className = 'status-led status-led--red';
    }

    els.tickerCount.textContent = active;
    els.tickerCount2.textContent = active;

    if (filtered.length === 0) {
      els.list.innerHTML = '<li class="empty-state"><span class="terminal-text--dim">' +
        (total === 0 ? '终端空闲 — 无待办任务' : '没有匹配的任务') +
        '</span></li>';
      return;
    }

    els.list.innerHTML = '';
    filtered.forEach(todo => {
      const li = document.createElement('li');
      li.className = 'todo-item';

      const check = document.createElement('span');
      check.className = 'todo-check' + (todo.done ? ' checked' : '');
      check.textContent = todo.done ? '✓' : '';
      check.addEventListener('click', function() {
        todo.done = !todo.done;
        save();
        render();
      });

      const text = document.createElement('span');
      text.className = 'todo-text' + (todo.done ? ' done' : '');
      text.textContent = todo.text;

      const del = document.createElement('button');
      del.className = 'todo-delete';
      del.textContent = '✕';
      del.addEventListener('click', function() {
        todos = todos.filter(t => t !== todo);
        save();
        render();
      });

      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(del);
      els.list.appendChild(li);
    });
  }

  function addTodo() {
    const text = els.input.value.trim();
    if (!text) return;
    todos.push({ text: text, done: false, id: Date.now() });
    els.input.value = '';
    save();
    render();
    els.input.focus();
  }

  function clearCompleted() {
    const before = todos.length;
    todos = todos.filter(t => !t.done);
    if (todos.length < before) {
      save();
      render();
    }
  }

  els.input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') addTodo();
  });
  els.addBtn.addEventListener('click', addTodo);
  els.clearBtn.addEventListener('click', clearCompleted);

  els.filterBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      els.filterBtns.forEach(function(b) { b.classList.remove('vintage-btn--active'); });
      btn.classList.add('vintage-btn--active');
      currentFilter = btn.getAttribute('data-filter');
      render();
    });
  });

  function updateClock() {
    const now = new Date();
    els.footerTime.textContent = now.toLocaleTimeString('zh-CN', { hour12: false }) + ' CST';
  }
  updateClock();
  setInterval(updateClock, 1000);

  render();
})();
</script>
</body>
</html>
